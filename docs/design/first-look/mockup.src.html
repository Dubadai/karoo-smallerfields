<meta charset="utf-8">
<title>BetterFields Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  @font-face { font-family: PlexReg; src: url(__PLEX_REGULAR__); }
  @font-face { font-family: PlexMed; src: url(__PLEX_MEDIUM__); }
  @font-face { font-family: PlexSemi; src: url(__PLEX_SEMIBOLD__); }
  @font-face { font-family: PlexCond; src: url(__PLEX_COND__); }
  :root { --bg: #2A2A2A; --ink: #EDEDED; --muted: #9A9A9A; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 PlexMed, system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h2 { font: 20px PlexSemi, sans-serif; margin: 40px 0 4px; }
  h2:first-child { margin-top: 0; }
  p.note { color: var(--muted); margin: 0 0 14px; max-width: 640px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .row canvas { max-width: 100%; height: auto !important; }
</style>
<main id="out"></main>
<script>
/*__KAROO_DEVICE_JS__*/
</script>
<script>
const ICONS = "__ICONS__";
const img = s => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = s; });

// Showcase numbers (design-assets/tools/field-gallery/showcase.json)
const F = {
  // short: the label in a BetterFields half, where the icon says the rest (bolt = power, flag-clock = lap)
  power: { label: '3S POWER', short: '3S', value: '280', icon: 'bolt', zone: 4, kind: 'power' },   // Z4 at 280 W
  hr:    { label: 'HR', short: 'HR', value: '132', icon: 'heart', zone: 2, kind: 'hr' },        // Z2 at 132 bpm
  speed: { label: 'SPEED', short: 'KM/H', value: '28.4', icon: 'speed' },
  lap:   { label: 'LAP TIME', short: 'LAP', value: '4:21', icon: 'lap-timer' },
};
// Zone colours: the Karoo's own. Its ride app colours HR and power zones from ONE table
// (climb1..7, same in light and dark, black text on them) and picks by how many zones the rider
// profile has (u8.d): 5 zones (HR) → c1 c2 c3 c4 c6; 7 zones (power) → c1..c7.
// Number in the zone colour: on white the deeper versions (BetterIntervals chart_hr light), on black the originals.
const KAROO = [null, '#60EEB2', '#00B988', '#FFF500', '#FB8C65', '#FE581F', '#D60404', '#B700A2'];
const KAROO_DEEP = [null, '#20AA78', '#007A5A', '#B9A300', '#E2683A', '#D9480F', '#C40404', '#A3008F'];
const PICKS = { 5: [1, 2, 3, 4, 6], 7: [1, 2, 3, 4, 5, 6, 7] };
const palette = zones => ({
  strong: [null, ...PICKS[zones].map(i => KAROO[i])],
  deep:   [null, ...PICKS[zones].map(i => KAROO_DEEP[i])],
  bright: [null, ...PICKS[zones].map(i => KAROO[i])],
});
const Z = { hr: palette(5), power: palette(7) };
const mix = (hex, base, t) => {             // hex over base at t (0..1)
  const h = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const [a, b] = [h(hex), h(base)];
  return '#' + a.map((v, i) => Math.round(b[i] + (v - b[i]) * t).toString(16).padStart(2, '0')).join('');
};
// Colours for one half: { bg, ink (label + icon), num }
function colours(f, dark, { num = 'bw', bg = 'none' } = {}) {
  const ink = dark ? '#FFFFFF' : '#000000';
  const zs = f.zone ? Z[f.kind] : null;
  if (!zs) return { bg: null, ink, num: ink };
  const z = f.zone;
  if (bg === 'strong')                       // Karoo: strong zone colour, black text (both modes)
    return { bg: zs.strong[z], ink: '#000000', num: num === 'zone' ? mix(zs.strong[z], '#000000', 0.42) : '#000000', strong: true };  // zone number on it: a dark shade of the zone
  if (bg === 'soft')                         // tonal: a light wash of the zone colour
    return { bg: mix(zs.strong[z], dark ? '#000000' : '#FFFFFF', dark ? 0.30 : 0.22), ink,
             num: num === 'zone' ? (dark ? zs.bright[z] : zs.deep[z]) : ink };
  return { bg: null, ink, num: num === 'zone' ? (dark ? zs.bright[z] : zs.deep[z]) : ink };
}

function text(ctx, s, font, size, color, right, baseline, maxW = 1e9, scaleX = 1) {
  ctx.font = `${size}px ${font}`;
  let w = ctx.measureText(s).width * scaleX;
  if (w > maxW) { size *= maxW / w; ctx.font = `${size}px ${font}`; w = maxW; }
  ctx.save(); ctx.translate(right, baseline); ctx.scale(scaleX, 1);
  ctx.fillStyle = color; ctx.textAlign = 'right'; ctx.fillText(s, 0, 0); ctx.restore();
  return size;
}
function iconAt(ctx, name, dark, x, y, k = 1) {
  const i = ICONS_IMG[`${name}-${dark ? 'dark' : 'light'}`];
  if (i) ctx.drawImage(i, x, y, i.width * k, i.height * k);
}

// A Karoo stock field (same metrics as compose.swift)
function stock(ctx, r, f, dark) {
  const ink = dark ? '#FFF' : '#000';
  const ls = r.h < 150 ? 28 : 31.875;
  text(ctx, f.label, 'PlexCond', ls, ink, r.x + r.w - 8, r.y + 8 + ls * 0.82, r.w - 90);
  iconAt(ctx, f.icon, dark, r.x + 6, r.y + 6 + ls * 0.82 - 40 * 0.62);
  text(ctx, f.value, 'PlexReg', Math.min(r.h * 0.58, 116), ink, r.x + r.w - 8, r.y + r.h - r.h * 0.08, r.w - 16, 0.82);
}

// One half of a BetterFields tile: the same parts as a Karoo field, smaller.
function half(ctx, r, f, dark, opts) {
  const c = colours(f, dark, opts);
  if (c.bg) { ctx.fillStyle = c.bg; ctx.fillRect(r.x, r.y, r.w, r.h); }
  const stacked = r.w > r.h * 1.8;
  const ls = stacked ? 24 : 26;           // short labels, close to the Karoo's 28 / 31.875
  const k = stacked ? 0.7 : 0.75;          // icons bigger: they carry the meaning
  const iw = ICONS_IMG[`${f.icon}-light`].width * k;
  text(ctx, f.short || f.label, 'PlexCond', ls, c.ink, r.x + r.w - 8, r.y + 7 + ls * 0.82, r.w - 8 - (7 + iw + 6));
  const iy = r.y + 5 + ls * 0.82 - 40 * k * 0.62;
  if (c.bg) {   // icons are opaque (white or black ground): multiply the black one, screen the white one
    const white = c.ink === '#FFFFFF', i = ICONS_IMG[`${f.icon}-${white ? 'dark' : 'light'}`];
    ctx.save(); ctx.globalCompositeOperation = white ? 'screen' : 'multiply';
    ctx.drawImage(i, r.x + 7, iy, i.width * k, i.height * k); ctx.restore();
  } else iconAt(ctx, f.icon, dark, r.x + 7, iy, k);
  const size = stacked ? r.h * 0.66 : Math.min(r.h * 0.5, 84);
  text(ctx, f.value, 'PlexReg', size, c.num, r.x + r.w - 10, r.y + r.h - (stacked ? 7 : r.h * 0.08), r.w - 24, 0.82);
  return !!c.bg;
}

// The tile drawn as two small Karoo tiles: the page grey fills the gap, each half is its own card
// (Karoo radius 14, 1 px #7D7D7D border). Gaps as between the Karoo's own tiles: 2 px between
// columns, 6 px between rows (the Karoo's 5-row pages; 12 px on 4-row pages).
function betterFields(ctx, r, a, b, dark, opts = {}) {
  const layout = opts.layout || 'side';
  if (opts.tiles === 'single' || opts.boundaries === false) {
    // Single: one Karoo tile, split by a 1 px line in the Karoo's border grey, edge to edge.
    // Boundaries off: the Karoo draws no cards, so neither do we (separate = no line, like its own fields).
    const divider = '#7D7D7D';
    const halves = layout === 'side'
      ? [{ x: r.x, y: r.y, w: r.w / 2, h: r.h }, { x: r.x + r.w / 2, y: r.y, w: r.w / 2, h: r.h }]
      : [{ x: r.x, y: r.y, w: r.w, h: r.h / 2 }, { x: r.x, y: r.y + r.h / 2, w: r.w, h: r.h / 2 }];
    const f1 = half(ctx, halves[0], a, dark, opts), f2 = half(ctx, halves[1], b, dark, opts);
    if (opts.tiles === 'single') {
      ctx.fillStyle = divider;
      if (layout === 'side') ctx.fillRect(Math.round(r.x + r.w / 2) - 0.5, r.y, 1, r.h);
      else ctx.fillRect(r.x, Math.round(r.y + r.h / 2) - 0.5, r.w, 1);
    }
    return;
  }
  const gap = layout === 'side' ? 2 : 6;
  ctx.fillStyle = dark ? '#484848' : '#DDDDDD'; ctx.fillRect(r.x, r.y, r.w, r.h);
  const cards = layout === 'side'
    ? [{ x: r.x, y: r.y, w: (r.w - gap) / 2, h: r.h }, { x: r.x + (r.w + gap) / 2, y: r.y, w: (r.w - gap) / 2, h: r.h }]
    : [{ x: r.x, y: r.y, w: r.w, h: (r.h - gap) / 2 }, { x: r.x, y: r.y + (r.h + gap) / 2, w: r.w, h: (r.h - gap) / 2 }];
  [a, b].forEach((f, i) => {
    const c = cards[i];
    const path = () => { ctx.beginPath(); ctx.roundRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1, 14); };
    ctx.save(); path(); ctx.fillStyle = dark ? '#000' : '#FFF'; ctx.fill(); ctx.clip();
    half(ctx, c, f, dark, opts);
    ctx.restore();
    path(); ctx.strokeStyle = '#7D7D7D'; ctx.lineWidth = 1; ctx.stroke();
  });
}

// Page: data field boundaries on, quarter grid (4 rows of 168), status bar during a ride.
function page(ctx, dark, ours, boundaries = true) {
  const bg = dark ? '#000' : '#FFF', ink = dark ? '#FFF' : '#000';
  ctx.fillStyle = boundaries ? (dark ? '#484848' : '#DDDDDD') : bg; ctx.fillRect(0, 0, 480, 800);
  // status bar
  ctx.fillStyle = ink; ctx.strokeStyle = ink; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(19, 19, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(19, 19, 5, 0, Math.PI * 2); ctx.fill();
  text(ctx, '1:12:40', 'PlexReg', 46, ink, 208, 50);
  text(ctx, '100%', 'PlexReg', 34, ink, 318, 46, 1e9, 0.82);
  text(ctx, '10:24', 'PlexReg', 46, ink, 470, 50);
  const stocks = [F.speed, F.hr, F.lap, F.power, { label: 'LAP AVG SPEED', value: '29.1', icon: 'lap-speed' }, F.speed];
  let n = 0;
  for (let row = 0; row < 4; row++) for (let col = 0; col < 2; col++) {
    const r = { x: col ? 241 : 1, y: 60 + row * 180, w: 238, h: 168 };
    ctx.save(); ctx.beginPath(); ctx.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 14);
    ctx.fillStyle = bg; ctx.fill(); ctx.clip();
    const mine = ours[`${row},${col}`];
    if (mine) mine(ctx, r); else stock(ctx, r, stocks[n++ % stocks.length], dark);
    ctx.restore();
    if (boundaries) { ctx.beginPath(); ctx.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 14);
      ctx.strokeStyle = '#7D7D7D'; ctx.lineWidth = 1; ctx.stroke(); }
  }
}

// Settings page (light), with the Example card at the top like BigWatts.
function settings(ctx, opts) {
  const ink = '#1C2E2E', help = '#6F6F6F';
  ctx.fillStyle = '#FFF'; ctx.fillRect(0, 0, 480, 800);
  text(ctx, '100%', 'PlexReg', 30, '#000', 350, 38, 1e9, 0.9); text(ctx, '10:24', 'PlexReg', 34, '#000', 470, 38);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(66, 104); ctx.lineTo(38, 104); ctx.moveTo(50, 92); ctx.lineTo(38, 104); ctx.lineTo(50, 116); ctx.stroke();
  ctx.font = '28px PlexMed'; ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.fillText('Settings', 240, 114);
  ctx.textAlign = 'left'; ctx.font = '34px PlexSemi'; ctx.fillText('BetterFields', 22, 208);
  // Example card
  ctx.fillStyle = '#F1F1EF'; ctx.beginPath(); ctx.roundRect(22, 232, 436, 266, 18); ctx.fill();
  ctx.font = '15px PlexSemi'; ctx.fillStyle = '#6B6A66'; ctx.fillText('EXAMPLE', 40, 262);
  const r = { x: 121, y: 280, w: 238, h: 168 };
  ctx.save(); ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.fillStyle = '#FFF'; ctx.fill(); ctx.clip();
  betterFields(ctx, r, F.power, F.hr, false, opts); ctx.restore();
  ctx.beginPath(); ctx.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 14); ctx.strokeStyle = '#D5D4CF'; ctx.lineWidth = 1; ctx.stroke();
  ctx.font = '15px PlexMed'; ctx.fillStyle = '#6B6A66'; ctx.textAlign = 'center'; ctx.fillText('Quarter tile', 240, 478); ctx.textAlign = 'left';
  // Field pickers
  const picker = (y, title, value) => {
    ctx.font = '17px PlexMed'; ctx.fillStyle = help; ctx.fillText(title, 22, y);
    ctx.font = '26px PlexMed'; ctx.fillStyle = ink; ctx.fillText(value, 22, y + 34);
    ctx.strokeStyle = ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(440, y + 14); ctx.lineTo(450, y + 24); ctx.lineTo(440, y + 34); ctx.stroke();
    ctx.fillStyle = '#DDDDDD'; ctx.fillRect(22, y + 56, 436, 1);
  };
  picker(536, 'Field 1', '3s Power'); picker(614, 'Field 2', 'Heart rate');
  ctx.font = '28px PlexMed'; ctx.fillStyle = ink; ctx.fillText('Layout', 22, 738);
  const seg = (y, items, sel) => {
    ctx.fillStyle = '#F4F4F4'; ctx.beginPath(); ctx.roundRect(22, y, 436, 70, 35); ctx.fill();
    const w = 436 / items.length;
    items.forEach((t, i) => {
      if (i === sel) { ctx.fillStyle = '#3E5560'; ctx.beginPath(); ctx.roundRect(24 + i * w, y + 2, w - 4, 66, 33); ctx.fill(); }
      ctx.font = '21px PlexMed'; ctx.fillStyle = i === sel ? '#FFF' : '#243535'; ctx.textAlign = 'center';
      ctx.fillText(t, 22 + i * w + w / 2, y + 43); ctx.textAlign = 'left';
    });
  };
  seg(756, ['Side by side', 'Stacked'], opts.layout === 'side' ? 0 : 1);
  return seg;
}
// Second settings screen: scrolled down to Layout and Zone colours
function settings2(ctx, opts) {
  const ink = '#1C2E2E', help = '#6F6F6F';
  ctx.fillStyle = '#FFF'; ctx.fillRect(0, 0, 480, 800);
  text(ctx, '100%', 'PlexReg', 30, '#000', 350, 38, 1e9, 0.9); text(ctx, '10:24', 'PlexReg', 34, '#000', 470, 38);
  const seg = (y, items, sel) => {
    ctx.fillStyle = '#F4F4F4'; ctx.beginPath(); ctx.roundRect(22, y, 436, 70, 35); ctx.fill();
    const w = 436 / items.length;
    items.forEach((t, i) => {
      if (i === sel) { ctx.fillStyle = '#3E5560'; ctx.beginPath(); ctx.roundRect(24 + i * w, y + 2, w - 4, 66, 33); ctx.fill(); }
      ctx.font = '21px PlexMed'; ctx.fillStyle = i === sel ? '#FFF' : '#243535'; ctx.textAlign = 'center';
      ctx.fillText(t, 22 + i * w + w / 2, y + 43); ctx.textAlign = 'left';
    });
  };
  // Example card stays on top (sticky) so changes show right away
  ctx.fillStyle = '#F1F1EF'; ctx.beginPath(); ctx.roundRect(22, 70, 436, 236, 18); ctx.fill();
  ctx.font = '15px PlexSemi'; ctx.fillStyle = '#6B6A66'; ctx.fillText('EXAMPLE', 40, 100);
  const r = { x: 121, y: 118, w: 238, h: 168 };
  ctx.save(); ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.fillStyle = '#FFF'; ctx.fill(); ctx.clip();
  betterFields(ctx, r, F.power, F.hr, false, opts); ctx.restore();
  ctx.beginPath(); ctx.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 14); ctx.strokeStyle = '#D5D4CF'; ctx.lineWidth = 1; ctx.stroke();
  const title = (t, y) => { ctx.font = '26px PlexMed'; ctx.fillStyle = ink; ctx.fillText(t, 22, y); };
  title('Layout', 342); seg(354, ['Side by side', 'Stacked'], opts.layout === 'side' ? 0 : 1);
  title('Tiles', 456); seg(468, ['Separate', 'Single'], opts.tiles === 'single' ? 1 : 0);
  title('Number', 570); seg(582, ['Black / white', 'Zone colour'], opts.num === 'zone' ? 1 : 0);
  title('Background', 684); seg(696, ['None', 'Karoo', 'Soft'], { none: 0, strong: 1, soft: 2 }[opts.bg || 'none']);
}

// Every Number × Background combination as bare tiles (no device): 3 rows × 2 columns.
function combos(dark, layout, tiles) {
  const S = 2, tw = 238, th = 168, gx = 24, top = 44, left = 96, gy = 40;
  const c = document.createElement('canvas');
  const W = left + 2 * tw + gx + 8, H = top + 3 * (th + gy);
  c.width = W * S; c.height = H * S; c.style.width = '390px';
  const ctx = c.getContext('2d'); ctx.scale(S, S);
  ctx.fillStyle = dark ? '#484848' : '#DDDDDD'; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 16); ctx.fill();
  const lab = dark ? '#E0E0E0' : '#333';
  ctx.font = '15px PlexSemi'; ctx.fillStyle = lab; ctx.textAlign = 'center';
  ['Black / white', 'Zone colour'].forEach((t, i) => ctx.fillText(t, left + i * (tw + gx) + tw / 2, 28));
  ctx.textAlign = 'left';
  ['None', 'Karoo', 'Soft'].forEach((t, j) => {
    const y = top + j * (th + gy);
    ctx.font = '15px PlexSemi'; ctx.fillStyle = lab; ctx.fillText(t, 14, y + th / 2 + 5);
    ['bw', 'zone'].forEach((num, i) => {
      const r = { x: left + i * (tw + gx), y, w: tw, h: th };
      ctx.save(); ctx.beginPath(); ctx.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 14);
      ctx.fillStyle = dark ? '#000' : '#FFF'; ctx.fill(); ctx.clip();
      betterFields(ctx, r, F.power, F.hr, dark, { layout, tiles, num, bg: ['none', 'strong', 'soft'][j] });
      ctx.restore();
      ctx.beginPath(); ctx.roundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 14);
      ctx.strokeStyle = '#7D7D7D'; ctx.lineWidth = 1; ctx.stroke();
    });
  });
  return c;
}

let ICONS_IMG = {};
(async () => {
  await document.fonts.load('40px PlexReg'); await document.fonts.load('40px PlexCond');
  await document.fonts.load('40px PlexMed'); await document.fonts.load('40px PlexSemi');
  for (const [k, v] of Object.entries(ICONS)) ICONS_IMG[k] = await img(v);
  const blank = document.createElement('canvas'); blank.width = 480; blank.height = 800;
  const dev = await KarooDevice.load({ frame: '__FRAME__', screen: blank.toDataURL() });
  const out = document.getElementById('out');
  const W = 380;
  const section = (title, note, makers) => {
    const h = document.createElement('h2'); h.textContent = title; out.append(h);
    if (note) { const p = document.createElement('p'); p.className = 'note'; p.textContent = note; out.append(p); }
    const row = document.createElement('div'); row.className = 'row'; out.append(row);
    for (const draw of makers) row.append(dev.device(dev.screen({ draw, scale: 2 }), W));
  };
  const ridePage = opts => dark => ctx => page(ctx, dark, {
    '1,0': (c, r) => betterFields(c, r, F.power, F.hr, dark, opts),
    '2,1': (c, r) => betterFields(c, r, F.speed, F.lap, dark, opts),
  }, opts.boundaries !== false);
  const pair = opts => [ridePage(opts)(false), ridePage(opts)(true)];

  const grid = (title, note, layout, tiles) => {
    const h = document.createElement('h2'); h.textContent = title; out.append(h);
    if (note) { const p = document.createElement('p'); p.className = 'note'; p.textContent = note; out.append(p); }
    const row = document.createElement('div'); row.className = 'row'; out.append(row);
    row.append(combos(false, layout, tiles), combos(true, layout, tiles));
  };

  section('Tiles · Separate', 'Each field looks like its own small Karoo tile: page grey between, rounded corners, border. 2 px between columns, 6 px between rows, as the Karoo’s own tiles.', pair({ layout: 'side' }));
  section('Tiles · Single', 'One Karoo tile, split by a 1 px line in the Karoo’s border grey, top to bottom.', pair({ layout: 'side', tiles: 'single' }));
  section('Boundaries off · Separate', 'The Karoo tells each field if Data field boundaries is on (ViewConfig.boundariesEnabled). Off: no cards on the page, so Separate draws none either: two fields side by side, nothing between, like the Karoo’s own.', pair({ layout: 'side', boundaries: false }));
  section('Boundaries off · Single', 'Single keeps its line.', pair({ layout: 'side', tiles: 'single', boundaries: false }));
  section('Side by side · Karoo background', 'Zone colour fills each half, strong like the Karoo’s own zone fields, black text. 3s power Z4, HR Z2.', pair({ layout: 'side', bg: 'strong' }));
  section('Stacked · Soft background + zone number', 'A light wash of the zone colour, the number in a deeper (light) or brighter (dark) shade of it.', pair({ layout: 'stacked', bg: 'soft', num: 'zone' }));
  grid('Every combination · side by side', 'Number (columns) × Background (rows). Fields without zones (speed, lap time) stay black / white.', 'side');
  grid('Every combination · stacked', null, 'stacked');
  grid('Every combination · single tile', 'Tiles: Single, side by side.', 'side', 'single');
  section('Settings', 'Field 1 and 2, then Layout, Number and Background; the Example follows every change.', [
    ctx => settings(ctx, { layout: 'side', bg: 'strong' }),
    ctx => settings2(ctx, { layout: 'side', num: 'bw', bg: 'strong' }),
  ]);
  const n = document.createElement('p'); n.className = 'note';
  n.textContent = 'Colours: the Karoo’s own. Its ride app colours power and HR zones from one table, picked by how many zones your profile has (7 for power, 5 for HR), black text on them. 3s power 280 W is Z4 (salmon), HR 132 is Z2 (green).';
  out.append(n);
})();
</script>
